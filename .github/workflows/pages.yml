name: Deploy frontend to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Set public API URL
        env:
          SIBIL_API_URL: ${{ vars.SIBIL_API_URL }}
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync} from 'node:fs';
          const url=process.env.SIBIL_API_URL || '';
          if(url && (new URL(url).protocol !== 'https:' || (new URL(url).origin !== url && !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(url)))) throw Error('SIBIL_API_URL must be an HTTPS origin or Apps Script web app /exec URL');
          writeFileSync('public/config.js','window.SIBIL_CONFIG = Object.freeze('+JSON.stringify({apiBaseUrl:url})+');'+String.fromCharCode(10));
          JS
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
